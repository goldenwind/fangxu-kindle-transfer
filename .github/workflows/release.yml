name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          # Go 1.22 binaries cannot run on current macOS runners because they
          # lack the LC_UUID load command required by the newer loader.
          go-version: "1.24.x"
          cache: false
      - name: Test
        run: go test ./...
      - name: Build release files
        run: |
          mkdir -p dist build/Kindle传书.app/Contents/MacOS
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags=-s -o dist/kindle-send-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags=-s -o build/kindle-send-macos-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags=-s -o build/kindle-send-macos-arm64 .
          lipo -create -output dist/kindle-send-macos-universal build/kindle-send-macos-amd64 build/kindle-send-macos-arm64
          cp packaging/macos/Info.plist build/Kindle传书.app/Contents/Info.plist
          cp packaging/macos/Kindle传书 build/Kindle传书.app/Contents/MacOS/Kindle传书
          cp dist/kindle-send-macos-universal build/Kindle传书.app/Contents/MacOS/kindle-send-bin
          chmod +x build/Kindle传书.app/Contents/MacOS/Kindle传书 build/Kindle传书.app/Contents/MacOS/kindle-send-bin dist/kindle-send-macos-universal
          codesign --force --deep --sign - build/Kindle传书.app
          ditto -c -k --sequesterRsrc --keepParent build/Kindle传书.app dist/Kindle传书-macOS.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/Kindle传书-macOS.zip dist/kindle-send-macos-universal dist/kindle-send-windows-amd64.exe --generate-notes --title "方序传书 ${GITHUB_REF_NAME}"
